<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<h2>Оформление заказа</h2>

<form method="post" th:action="@{/order/checkout}" th:object="${orderDto}">

    <label>Имя:</label>
    <input type="text" th:field="*{customerName}" required>

    <label>Телефон:</label>
    <input type="text" th:field="*{phone}" required>

    <label>Адрес:</label>
    <input type="text" th:field="*{address}" required>

    <label>Комментарий:</label>
    <textarea th:field="*{comment}"></textarea>

    <button type="submit">Подтвердить заказ</button>
</form>

</body>
</html>
