<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Оформление заказа')}"></head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="ks-container">
    <div class="ks-card" style="max-width: 600px; margin: 0 auto;">

        <h2 class="ks-page-title">Оформление заказа</h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/order/checkout}" th:object="${orderDto}" method="post">

            <div class="mb-3">
                <label>Имя</label><br>
                <input type="text" th:field="*{name}" required>
            </div>

            <div class="mb-3">
                <label>Телефон</label><br>
                <input type="text" th:field="*{phone}" required>
            </div>

            <div class="mb-3">
                <label>Адрес доставки</label><br>
                <textarea th:field="*{address}" required></textarea>
            </div>

            <div class="mb-3">
                <label>Комментарий (необязательно)</label><br>
                <textarea th:field="*{comment}"></textarea>
            </div>

            <button type="submit">Подтвердить заказ</button>
        </form>

    </div>
</div>

</body>
</html>
