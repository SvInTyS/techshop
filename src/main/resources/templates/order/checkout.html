<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Оформление заказа')}"></head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="ks-container">
    <div class="ks-card" style="max-width: 800px; margin: 0 auto;">

        <h2 class="ks-page-title">Оформление заказа</h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Состав заказа -->
        <h3 class="ks-section-title">Товары в заказе</h3>
        <table>
            <tr>
                <th>Товар</th>
                <th>Кол-во</th>
                <th>Цена</th>
                <th>Итого</th>
                <th>На складе</th>
            </tr>
            <tr th:each="item : ${items}">
                <td th:text="${item.product.name}"></td>
                <td th:text="${item.quantity}"></td>
                <td th:text="${item.product.price}"></td>
                <td th:text="${item.total}"></td>
                <td>
                    <span th:text="${item.product.stock}"></span> шт.
                </td>
            </tr>
        </table>

        <p style="margin-top: 12px;">
            Сумма: <strong th:text="${total}"></strong> $
        </p>

        <hr style="margin: 20px 0;">

        <!-- Форма данных покупателя -->
        <form th:action="@{/order/checkout}" th:object="${orderDto}" method="post">

            <div class="mb-3">
                <label>Имя</label><br>
                <input type="text" th:field="*{name}" required>
            </div>

            <div class="mb-3">
                <label>Телефон</label><br>
                <input type="text" th:field="*{phone}" required>
            </div>

            <div class="mb-3">
                <label>Адрес доставки</label><br>
                <textarea th:field="*{address}" required></textarea>
            </div>

            <div class="mb-3">
                <label>Комментарий (необязательно)</label><br>
                <textarea th:field="*{comment}"></textarea>
            </div>

            <button type="submit">Подтвердить заказ</button>
            <a href="/cart" class="btn btn-secondary" style="margin-left:8px;">Назад в корзину</a>
        </form>

    </div>
</div>

</body>
</html>
