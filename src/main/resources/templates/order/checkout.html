<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<h2>Оформление заказа</h2>

<div th:if="${error}" style="color:red; margin-bottom: 10px;"
     th:text="${error}"></div>

<form th:action="@{/order/checkout}" th:object="${orderDto}" method="post">

    <label>Имя:</label><br>
    <input type="text" th:field="*{name}" required><br><br>

    <label>Телефон:</label><br>
    <input type="text" th:field="*{phone}" required><br><br>

    <label>Адрес доставки:</label><br>
    <textarea th:field="*{address}" required></textarea><br><br>

    <label>Комментарий (необязательно):</label><br>
    <textarea th:field="*{comment}"></textarea><br><br>

    <button type="submit">Подтвердить заказ</button>
</form>

</body>
</html>
