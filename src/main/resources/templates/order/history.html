<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<h2>Мои заказы</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Дата</th>
        <th>Сумма</th>
        <th></th>
    </tr>

    <tr th:each="o : ${orders}">
        <td th:text="${o.id}"></td>
        <td th:text="${o.createdAt}"></td>
        <td th:text="${o.total} + ' $'"></td>
        <td>
            <a th:href="@{'/order/' + ${o.id}}">Подробнее</a>
        </td>
    </tr>
</table>

</body>
</html>
