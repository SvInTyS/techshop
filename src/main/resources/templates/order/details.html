<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Детали заказа')}"></head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="ks-container">
    <div class="ks-card">

        <h2 class="ks-page-title">
            Детали заказа #<span th:text="${order.id}"></span>
        </h2>

        <p>Статус: <strong th:text="${order.status}"></strong></p>

        <p>Имя: <span th:text="${order.customerName}"></span></p>
        <p>Телефон: <span th:text="${order.phone}"></span></p>
        <p>Адрес: <span th:text="${order.address}"></span></p>

        <h3 class="ks-section-title">Товары</h3>
        <table>
            <tr><th>Товар</th><th>Кол-во</th><th>Цена</th><th>Итого</th></tr>
            <tr th:each="it : ${order.items}">
                <td th:text="${it.product.name}"></td>
                <td th:text="${it.quantity}"></td>
                <td th:text="${it.price}"></td>
                <td th:text="${it.total}"></td>
            </tr>
        </table>

        <p style="margin-top: 16px;">
            Сумма: <strong th:text="${order.total}"></strong>
        </p>

        <a href="/order/history" class="btn btn-secondary">Назад к списку заказов</a>

    </div>
</div>

</body>
</html>
