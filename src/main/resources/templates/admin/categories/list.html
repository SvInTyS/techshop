<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Админка — категории')}"></head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="ks-container">
    <div class="ks-card">

        <div class="ks-page-header">
            <h2 class="ks-page-title">Категории</h2>
            <a class="btn btn-sm" href="/admin/categories/create">+ Создать</a>
        </div>

        <table>
            <thead><tr><th>ID</th><th>Название</th><th>Действия</th></tr></thead>
            <tbody>
            <tr th:each="c : ${categories}">
                <td th:text="${c.id}">1</td>
                <td th:text="${c.name}">Name</td>
                <td>
                    <a th:href="@{'/admin/categories/edit/' + ${c.id}}"
                       class="btn btn-sm btn-secondary">Ред.</a>
                    <form th:action="@{'/admin/categories/delete/' + ${c.id}}"
                          method="post"
                          style="display:inline"
                          onsubmit="return confirm('Удалить категорию?');">
                        <button class="btn btn-sm btn-danger" type="submit">Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

    </div>
</div>
</body>
</html>
