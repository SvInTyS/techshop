<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Категории</h2>
        <a class="btn btn-primary" href="/admin/categories/create">Создать</a>
    </div>

    <table class="table table-striped">
        <thead><tr><th>ID</th><th>Название</th><th>Действия</th></tr></thead>
        <tbody>
        <tr th:each="c : ${categories}">
            <td th:text="${c.id}">1</td>
            <td th:text="${c.name}">Name</td>
            <td>
                <a th:href="@{'/admin/categories/edit/' + ${c.id}}" class="btn btn-sm btn-outline-secondary">Ред.</a>
                <form th:action="@{'/admin/categories/delete/' + ${c.id}}" method="post" style="display:inline"
                      onsubmit="return confirm('Удалить категорию?');">
                    <button class="btn btn-sm btn-danger">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
