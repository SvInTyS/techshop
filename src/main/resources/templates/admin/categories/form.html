<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Админка — категория')}"></head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="ks-container">
    <div class="ks-card" style="max-width: 500px; margin: 0 auto;">
        <h2 class="ks-page-title"
            th:text="${category.id} != null ? 'Редактировать категорию' : 'Создать категорию'"></h2>

        <form th:action="@{/admin/categories/save}" th:object="${category}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label class="form-label">Название</label>
                <input type="text" th:field="*{name}" required/>
            </div>

            <button class="btn" type="submit">Сохранить</button>
            <a class="btn btn-secondary" href="/admin/categories" style="margin-left:8px;">Отмена</a>
        </form>
    </div>
</div>
</body>
</html>
