<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Админка — детали заказа')}"></head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="ks-container">
    <div class="ks-card">

        <!-- Админ-навигация -->
        <div style="margin-bottom:12px;">
            <a href="/admin/products" class="btn btn-sm">Товары</a>
            <a href="/admin/orders" class="btn btn-sm btn-secondary" style="margin-left:4px;">Заказы</a>
            <a href="/admin/categories" class="btn btn-sm" style="margin-left:4px;">Категории</a>
            <a href="/admin/users" class="btn btn-sm" style="margin-left:4px;">Пользователи</a>
        </div>

        <h2 class="ks-page-title">
            Заказ #<span th:text="${order.id}"></span>
        </h2>

        <p>Покупатель:
            <span th:text="${order.user != null ? order.user.username : 'Гость'}"></span>
        </p>
        <p>Имя: <span th:text="${order.customerName}"></span></p>
        <p>Телефон: <span th:text="${order.phone}"></span></p>
        <p>Адрес: <span th:text="${order.address}"></span></p>
        <p>Статус: <b th:text="${order.status}"></b></p>

        <h4 class="ks-section-title">Товары</h4>
        <table>
            <thead><tr><th>Товар</th><th>Кол-во</th><th>Цена</th><th>Итого</th></tr></thead>
            <tbody>
            <tr th:each="it : ${order.items}">
                <td th:text="${it.product.name}"></td>
                <td th:text="${it.quantity}"></td>
                <td th:text="${it.price}"></td>
                <td th:text="${it.price.multiply(T(java.math.BigDecimal).valueOf(it.quantity))}"></td>
            </tr>
            </tbody>
        </table>

        <p style="margin-top:12px;">
            Итого: <b th:text="${order.total}"></b>
        </p>

        <a class="btn btn-secondary" href="/admin/orders">← Назад к списку</a>
    </div>
</div>
</body>
</html>
