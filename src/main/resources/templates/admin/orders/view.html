<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="container">
    <h2>Заказ #<span th:text="${order.id}"></span></h2>

    <p>Покупатель: <span th:text="${order.user != null ? order.user.username : 'Гость'}"></span></p>
    <p>Имя: <span th:text="${order.customerName}"></span></p>
    <p>Телефон: <span th:text="${order.phone}"></span></p>
    <p>Адрес: <span th:text="${order.address}"></span></p>

    <h4>Товары</h4>
    <table class="table">
        <thead><tr><th>Товар</th><th>Кол-во</th><th>Цена</th><th>Итого</th></tr></thead>
        <tbody>
        <tr th:each="it : ${order.items}">
            <td th:text="${it.product.name}"></td>
            <td th:text="${it.quantity}"></td>
            <td th:text="${it.price}"></td>
            <td th:text="${it.price.multiply(T(java.math.BigDecimal).valueOf(it.quantity))}"></td>
        </tr>
        </tbody>
    </table>

    <h5>Итого: <span th:text="${order.total}"></span></h5>
    <a class="btn btn-secondary" href="/admin/orders">Назад</a>
</div>
</body>
</html>
