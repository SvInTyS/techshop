<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Админка — заказы')}"></head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="ks-container">
    <div class="ks-card">
        <h2 class="ks-page-title">Заказы</h2>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Покупатель</th>
                <th>Дата</th>
                <th>Сумма</th>
                <th>Статус</th>
                <th>Детали</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td th:text="${o.id}"></td>
                <td th:text="${o.user != null ? o.user.username : 'Гость'}"></td>
                <td th:text="${o.createdAt}"></td>
                <td th:text="${o.total}"></td>
                <td th:text="${o.status}"></td>
                <td>
                    <a th:href="@{'/admin/orders/' + ${o.id}}"
                       class="btn btn-sm btn-secondary">Открыть</a>
                </td>
            </tr>
            </tbody>
        </table>

    </div>
</div>
</body>
</html>
