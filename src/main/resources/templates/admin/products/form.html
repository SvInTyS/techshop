<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="container">
    <h2 th:text="${product.id} != null ? 'Редактировать товар' : 'Создать товар'"></h2>

    <form th:action="@{/admin/products/save}"
          th:object="${product}"
          method="post">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Название</label>
            <input type="text" th:field="*{name}" class="form-control" required/>
        </div>

        <div class="mb-3">
            <label class="form-label">Описание</label>
            <textarea th:field="*{description}" class="form-control"></textarea>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Цена</label>
                <input type="number" step="0.01" th:field="*{price}" class="form-control" required/>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Склад</label>
                <input type="number" th:field="*{stock}" class="form-control" required/>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Категория</label>
                <select th:field="*{category.id}" class="form-select">
                    <option th:each="c : ${categories}"
                            th:value="${c.id}"
                            th:text="${c.name}">
                    </option>
                </select>
            </div>
        </div>

        <button class="btn btn-primary" type="submit">Сохранить</button>
        <a class="btn btn-secondary" href="/admin/products">Отмена</a>
    </form>
</div>
</body>
</html>
