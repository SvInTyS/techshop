<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Админка — товар')}"></head>
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="ks-container">
    <div class="ks-card" style="max-width: 700px; margin: 0 auto;">

        <h2 class="ks-page-title"
            th:text="${product.id} != null ? 'Редактировать товар' : 'Создать товар'"></h2>

        <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label class="form-label">Название</label>
                <input type="text" th:field="*{name}" required/>
            </div>

            <div class="mb-3">
                <label class="form-label">Описание</label>
                <textarea th:field="*{description}" rows="4"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">URL изображения</label>
                <input type="text" th:field="*{imageUrl}" placeholder="https://..."/>
                <div class="ks-tag-muted">
                    Можно оставить пустым — будет показана заглушка.
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Цена</label>
                <input type="number" step="0.01" th:field="*{price}" required/>
            </div>

            <div class="mb-3">
                <label class="form-label">Склад</label>
                <input type="number" th:field="*{stock}" required/>
            </div>

            <div class="mb-3">
                <label class="form-label">Категория</label>
                <select th:field="*{category.id}">
                    <option th:each="c : ${categories}"
                            th:value="${c.id}"
                            th:text="${c.name}">
                    </option>
                </select>
            </div>

            <button class="btn" type="submit">Сохранить</button>
            <a class="btn btn-secondary" href="/admin/products" style="margin-left:8px;">Отмена</a>
        </form>

    </div>
</div>
</body>
</html>
