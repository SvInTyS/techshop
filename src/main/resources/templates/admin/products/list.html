<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="container">
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Товары</h2>
        <a class="btn btn-primary" href="/admin/products/create">Создать товар</a>
    </div>


    <form class="mb-3" method="get" action="/admin/products">
        <div class="input-group">
            <input name="q" th:value="${q}" class="form-control" placeholder="Поиск по названию"/>
            <button class="btn btn-outline-secondary" type="submit">Поиск</button>
        </div>
    </form>

    <table class="table table-hover">
        <thead><tr><th>ID</th><th>Название</th><th>Категория</th><th>Цена</th><th>Склад</th><th>Действия</th></tr></thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.id}">1</td>
            <td th:text="${p.name}">Name</td>
            <td th:text="${p.category != null ? p.category.name : ''}"></td>
            <td th:text="${p.price}"></td>
            <td th:text="${p.stock}"></td>
            <td>
                <a th:href="@{'/admin/products/edit/' + ${p.id}}" class="btn btn-sm btn-outline-secondary">Ред.</a>
                <form th:action="@{'/admin/products/delete/' + ${p.id}}" method="post" style="display:inline"
                      onsubmit="return confirm('Удалить товар?');">
                    <button class="btn btn-sm btn-danger">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
