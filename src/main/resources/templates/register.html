<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Регистрация')}"></head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="ks-container">
    <div class="ks-card" style="max-width: 500px; margin: 40px auto;">
        <h1 class="ks-page-title" style="text-align:center;">Регистрация</h1>

        <form th:action="@{/register}" th:object="${userDto}" method="post">

            <div class="mb-3">
                <label>Имя</label>
                <input type="text" th:field="*{firstName}"/>
                <div th:if="${#fields.hasErrors('firstName')}"
                     th:errors="*{firstName}"
                     class="text-danger"></div>
            </div>

            <div class="mb-3">
                <label>Фамилия</label>
                <input type="text" th:field="*{lastName}"/>
                <div th:if="${#fields.hasErrors('lastName')}"
                     th:errors="*{lastName}"
                     class="text-danger"></div>
            </div>

            <div class="mb-3">
                <label>Почта (логин)</label>
                <input type="text" th:field="*{username}"/>
                <div th:if="${#fields.hasErrors('username')}"
                     th:errors="*{username}"
                     class="text-danger"></div>
            </div>

            <div class="mb-3">
                <label>Телефон</label>
                <input type="text" th:field="*{phone}"/>
                <div th:if="${#fields.hasErrors('phone')}"
                     th:errors="*{phone}"
                     class="text-danger"></div>
            </div>

            <div class="mb-3">
                <label>Пароль</label>
                <input type="password" th:field="*{password}"/>
                <div th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}"
                     class="text-danger"></div>
            </div>

            <div style="text-align:center;">
                <button type="submit">Создать аккаунт</button>
            </div>

            <p th:if="${error}" th:text="${error}" class="text-danger"
               style="margin-top:10px; text-align:center;"></p>

        </form>
    </div>
</div>

</body>
</html>
