<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('TechShop — Главная')}"></head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="ks-container">
    <div class="ks-card">
        <h1 class="ks-page-title">Добро пожаловать в TechShop!</h1>

        <h2 class="ks-section-title">Популярные товары</h2>

        <div th:if="${#lists.isEmpty(products)}">
            <p class="ks-tag-muted">Пока нет доступных товаров.</p>
        </div>

        <div th:each="p : ${products}" class="ks-product-list-item">
            <a th:href="@{'/products/' + ${p.id}}">
                <strong th:text="${p.name}">Product Name</strong>
            </a>
            <div>
                <span th:text="${p.price} + ' $'"></span>
                <span th:if="${p.stock == 0}" style="color:red; margin-left: 10px;">Нет в наличии</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
