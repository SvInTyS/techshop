<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Информация о товаре')}"></head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="ks-container">
    <div class="ks-card">

        <div style="display:flex; gap:20px; flex-wrap:wrap;">
            <div style="flex: 0 0 320px;">
                <div class="ks-product-thumb">
                    <img th:src="${product.imageUrl != null && !#strings.isEmpty(product.imageUrl) ? product.imageUrl : 'https://via.placeholder.com/320x220?text=TechShop'}"
                         alt="product image">
                </div>
            </div>

            <div style="flex: 1 1 auto; min-width:220px;">
                <h1 class="ks-page-title" th:text="${product.name}"></h1>

                <p th:text="${product.description}"></p>

                <p style="margin-top: 16px;">
                    Цена: <strong th:text="${product.price}"></strong> $
                </p>

                <p class="ks-tag-muted">
                    В наличии: <span th:text="${product.stock}"></span> шт.
                    <span th:if="${product.stock == 0}" style="color:red; margin-left: 6px;">Нет в наличии</span>
                </p>

                <div th:if="${product.stock > 0}" style="margin-top: 12px;">
                    <form th:action="@{'/cart/add/' + ${product.id}}" method="post">
                        <button type="submit" class="btn">Добавить в корзину</button>
                    </form>
                </div>
                <div th:if="${product.stock == 0}" style="margin-top: 12px;">
                    <p style="color:gray;">Товар недоступен для заказа</p>
                </div>

                <div style="margin-top: 16px;">
                    <a href="/products" class="btn btn-secondary">← Назад к каталогу</a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
