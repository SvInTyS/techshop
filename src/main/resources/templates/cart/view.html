<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Корзина')}"></head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="ks-container">
    <div class="ks-card">

        <h2 class="ks-page-title">Корзина</h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <table>
            <tr>
                <th>Название</th>
                <th>Количество</th>
                <th>Цена</th>
                <th>Итого</th>
                <th>Действия</th>
            </tr>

            <tr th:each="item : ${items}">
                <td th:text="${item.product.name}"></td>
                <td th:text="${item.quantity}"></td>
                <td th:text="${item.product.price}"></td>
                <td th:text="${item.total}"></td>

                <td>
                    <form th:action="@{'/cart/removeOne/' + ${item.product.id}}" method="post" style="display:inline;">
                        <button>-</button>
                    </form>

                    <form th:action="@{'/cart/add/' + ${item.product.id}}" method="post" style="display:inline;">
                        <button>+</button>
                    </form>

                    <form th:action="@{'/cart/removeAll/' + ${item.product.id}}" method="post" style="display:inline;">
                        <button>Удалить</button>
                    </form>
                </td>
            </tr>
        </table>

        <h3 style="margin-top: 16px;">Сумма: <span th:text="${total}"></span> $</h3>

        <form th:action="@{/order/checkout}" method="get" style="margin-top: 16px;">
            <button type="submit">Оформить заказ</button>
        </form>

    </div>
</div>

</body>
</html>
